<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="400" fill="url(#bgGrad)" rx="40" />
  
  <!-- Subtle circular grid / radar effect -->
  <circle cx="200" cy="200" r="160" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.25" fill="none" stroke-dasharray="6 6" />
  <circle cx="200" cy="200" r="120" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" fill="none" />
  
  <!-- Silhouette / Avatar Icon -->
  <g fill="none" stroke="url(#ringGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head -->
    <circle cx="200" cy="150" r="48" fill="#1e1b4b" fill-opacity="0.6" />
    <!-- Hair / Styling contour -->
    <path d="M165 140 C175 110, 225 110, 235 140" stroke="#a855f7" stroke-width="5" />
    <!-- Shoulders -->
    <path d="M120 275 C130 215, 270 215, 280 275" fill="#1e1b4b" fill-opacity="0.6" />
  </g>
  
  <!-- Monogram Badge -->
  <rect x="150" y="295" width="100" height="34" rx="17" fill="#0f172a" stroke="url(#ringGrad)" stroke-width="2" />
  <text x="200" y="318" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">K. SINDHU RANI</text>
  
  <!-- User prompt hint -->
  <text x="200" y="365" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Place profile.jpg in public/</text>
</svg>
